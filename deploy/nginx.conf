# badge-forge 反向代理示例（nginx）
#
# 用法：
#   1. 放到 /etc/nginx/conf.d/badge.conf
#   2. 改 server_name 与证书路径
#   3. nginx -t && systemctl reload nginx
#
# 要点：
#   - 徽章是 <img> 请求，量可能很大 —— 必须开 proxy_cache，否则每次 README 刷新都会打到达进程；
#   - 上游已带 Cache-Control，这里再加一层 nginx 缓存是为了「进程重启/多副本」时仍然不抖；
#   - 只缓存 GET，且缓存键含完整查询串（不同参数=不同徽章）。

proxy_cache_path /var/cache/nginx/badge levels=1:2 keys_zone=badge_zone:10m
                 max_size=512m inactive=1h use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name badge.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name badge.example.com;

    ssl_certificate     /etc/letsencrypt/live/badge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/badge.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 徽章响应很小，但图标内联后可能到几十 KB
    client_max_body_size 1m;
    gzip on;
    gzip_types image/svg+xml text/css application/javascript application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:9010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;

        # 只缓存成功的徽章渲染结果；出错（n/a）的响应自带 no-store，不会被缓存
        proxy_cache            badge_zone;
        proxy_cache_methods    GET;
        proxy_cache_key        $scheme$host$request_uri;
        proxy_cache_valid      200 5m;
        proxy_cache_valid      404 1m;
        proxy_cache_use_stale  error timeout updating;
        proxy_cache_background_update on;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    # 配置页与 API 文档不缓存，便于改完立刻看到效果
    location ~ ^/(api|health|favicon) {
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
}
